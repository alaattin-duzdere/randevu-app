# ===================================================================
# PROD PROFILE CONFIGURATION
# ===================================================================
# This file overrides properties in application.properties when the 'prod' profile is active.

# NEVER auto-update schema in production. Use tools like Flyway or Liquibase.
spring.jpa.hibernate.ddl-auto=validate

# Do not show SQL in production logs to avoid leaking PII and clutter
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# Standard security logging
logging.level.org.springframework.security=WARN
