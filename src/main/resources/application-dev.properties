# ===================================================================
# DEV PROFILE CONFIGURATION
# ===================================================================
# This file overrides properties in application.properties when the 'dev' profile is active.

# Update DB schema automatically in development
spring.jpa.hibernate.ddl-auto=create

# Show SQL queries in console
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Enable detailed security logging in development
logging.level.org.springframework.security=DEBUG

# SMS
application.sms.provider=mock

# CORS
application.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
