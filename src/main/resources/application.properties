# ===================================================================
# RANDEVU APP - SPRING BOOT APPLICATION CONFIGURATION
# ===================================================================
# This is the base configuration file. Properties defined here apply to all environments
# unless overridden by a profile-specific file (e.g., application-dev.properties).

# Import .env file automatically
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# 1. CORE APPLICATION
# ===================================================================
spring.application.name=randevu-app
# Server port. Can be overridden via PORT environment variable.
server.port=${BACKEND_PORT:8080}
app.base-url=${BACKEND_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
spring.output.ansi.enabled=always

# Active Spring Profile (e.g., dev, prod). Defaults to dev.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===================================================================
# 2. LOGGING
# ===================================================================
# Global root log level (INFO, WARN, ERROR, DEBUG, TRACE)
logging.level.root=INFO
# Custom log level for our application package. Injectable via APP_LOG_LEVEL.
logging.level.RandevuApp=${APP_LOG_LEVEL:INFO}
# Colorful and readable console output format.
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr([%thread]){magenta} %clr(%logger{40}){cyan} %clr(-){faint} %msg%n

# ===================================================================
# 3. DATABASE & JPA (Hibernate)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL Auto. Set to 'none' globally to prevent accidental schema changes. Managed in profiles.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===================================================================
# 4. JSON SERIALIZATION (Jackson)
# ===================================================================
spring.jackson.time-zone=UTC

# ===================================================================
# 5. SECURITY & JWT (Auth-Core)
# ===================================================================
auth-core.secret-key=${JWT_SECRET_KEY}
auth-core.expiration-ms=900000
auth-core.refresh-token-expiration-ms=2592000000
auth-core.enable-oauth=false

# Note: Use array index notation [0], [1]...
auth-core.whitelist[0]=/auth/**
auth-core.whitelist[1]=/public/**
auth-core.whitelist[2]=/swagger-ui/**
auth-core.whitelist[3]=/v3/api-docs/**
auth-core.whitelist[4]=/test/**
auth-core.whitelist[5]=/api/v1/verification/**
auth-core.whitelist[6]=/auth/forgot-password/**
auth-core.whitelist[7]=/swagger-ui.html
auth-core.whitelist[8]=/webjars/**
auth-core.whitelist[9]=/swagger-resources/**

app.security.phone-verification-validity-days=365
app.security.email-verification-validity-days=180

# ===================================================================
# 6. MAIL CONFIGURATION (SMTP)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# 7. SMS CONFIGURATION (MACRODROID)
# ===================================================================
# app.sms.provider=macrodroid
# macrodroid.webhook.url=${MACRODROID_WEBHOOK_URL:}
# macrodroid.webhook.secret=${MACRODROID_WEBHOOK_SECRET:}

# ===================================================================
# 8. ACTUATOR & MONITORING
# ===================================================================
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

# ===================================================================
# 9. VERIFICATION & SPAM PROTECTION
# ===================================================================
app.verification.token-validity-minutes=15
app.verification.max-attempts=3
app.verification.code-length=6
app.verification.password-reset-token-validity-minutes=15

app.verification.spam.max-requests-per-block=5
app.verification.spam.block-duration-minutes=30

# ===================================================================
# 10. REDIS
# ===================================================================
spring.data.redis.url=${SPRING_DATA_REDIS_URL}

# ===================================================================
# 11. BUSINESS
# ===================================================================
app.business.default-timezone=Europe/Istanbul
app.business.defaults.slot-duration-time=30
app.business.defaults.opening-time=09:00
app.business.defaults.closing-time=18:00

# ===================================================================
# 12. SWAGGER
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true

# ===================================================================
# 13. EXTERNAL APIs
# ===================================================================
locationiq.api.key=${LOCATIONIQ_API_KEY}
